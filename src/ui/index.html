<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balcão PDV</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="cabecalho">
    <div class="logo-area">
      <img id="logo-preview" src="" alt="Logo" class="logo-img hidden">
      <span class="logo-placeholder">Balcão PDV</span>
    </div>
    <h1 id="nome-comercio-display" class="nome-comercio">Mokshyaa Soluções</h1>
    <button id="btn-menu" class="btn-hamburguer" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <div class="container-principal">
    <nav class="navegacao-lateral">
      <ul class="menu-modulos">
        <li><a href="#" class="ativo" data-modulo="configuracoes">Configurações</a></li>
        <li><a href="#" data-modulo="comandas">Comandas</a></li>
        <li><a href="#" data-modulo="produtos">Produtos</a></li>
        <li><a href="#" data-modulo="relatorios">Relatórios</a></li>
      </ul>
    </nav>

    <main class="area-conteudo">
      <section id="modulo-configuracoes" class="modulo ativo">
        <div class="cabecalho-modulo">
          <h2>Configurações do Sistema</h2>
          <p class="subtitulo">Personalize o Balcão PDV para o seu comércio</p>
        </div>

        <form id="form-configuracoes" class="formulario-configuracoes">
          <div class="grupo-campos">
            <div class="campo">
              <label for="nome-comercio">Nome do Comércio</label>
              <input type="text" id="nome-comercio" name="nome_comercio" required>
            </div>

            <div class="campo">
              <label for="cnpj">CNPJ</label>
              <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" maxlength="18">
            </div>
          </div>

          <div class="campo">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco">
          </div>

          <div class="campo campo-logo">
            <label for="logo">Logo do Comércio</label>
            <input type="file" id="logo" name="logo" accept="image/*">
            <span class="hint">Selecione uma imagem para o logo</span>
          </div>

          <div class="grupo-cores">
            <div class="campo campo-cor">
              <label for="cor-primaria">Cor Primária</label>
              <input type="color" id="cor-primaria" name="cor_primaria" value="#1a1a2e">
            </div>

            <div class="campo campo-cor">
              <label for="cor-secundaria">Cor Secundária</label>
              <input type="color" id="cor-secundaria" name="cor_secundaria" value="#2c3e7a">
            </div>

            <div class="campo campo-cor">
              <label for="cor-destaque">Cor de Destaque</label>
              <input type="color" id="cor-destaque" name="cor_destaque" value="#e8b84b">
            </div>
          </div>

          <div class="campo">
            <label for="chave-licenca">Chave de Licença</label>
            <input type="text" id="chave-licenca" name="chave_licenca">
          </div>

          <div class="acoes-formulario">
            <button type="submit" id="btn-salvar" class="btn-primario">
              <span class="texto-btn">Salvar Configurações</span>
              <span class="spinner hidden"></span>
            </button>
            <span id="feedback" class="feedback hidden"></span>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="js/configuracoes.js"></script>
